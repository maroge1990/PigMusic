name: Native client checks

# Runs only when the Swift apps, the API contract, the brand kit or the
# scripts that produce them change. Server-only pushes are covered by
# container.yml, which also checks the OpenAPI contract.
on:
  pull_request:
    paths:
      - 'swift/**'
      - 'api/**'
      - 'docs/pig-family-brand-tokens.json'
      - 'docs/native-brand-assets.json'
      - 'docs/brand-asset-provenance.json'
      - 'scripts/serve_contract_fixture.py'
      - 'scripts/generate_native_project.py'
      - 'scripts/generate_ui_test_project.py'
      - 'scripts/simulator_ui_tests.py'
      - 'scripts/serve_ui_test_server.py'
      - 'scripts/sync_native_brand.py'
      - 'scripts/generate_brand_tokens.py'
      - '.github/workflows/native.yml'
  push:
    branches: [main, 'feature/**', 'codex/**']
    paths:
      - 'swift/**'
      - 'api/**'
      - 'docs/pig-family-brand-tokens.json'
      - 'docs/native-brand-assets.json'
      - 'docs/brand-asset-provenance.json'
      - 'scripts/serve_contract_fixture.py'
      - 'scripts/generate_native_project.py'
      - 'scripts/generate_ui_test_project.py'
      - 'scripts/simulator_ui_tests.py'
      - 'scripts/serve_ui_test_server.py'
      - 'scripts/sync_native_brand.py'
      - 'scripts/generate_brand_tokens.py'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            swift/PigKit/.build
            swift/build/PigMusic/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift/PigKit/Package.swift', 'swift/PigKit/Package.resolved', 'swift/PigMusic.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Verify approved branding assets and roles
        run: |
          python scripts/sync_native_brand.py --check
          python scripts/generate_brand_tokens.py --check
      - name: Generated client against isolated server
        run: |
          python -m pip install -r requirements.lock.txt
          python -m scripts.export_openapi --check
          python -m scripts.serve_contract_fixture > /tmp/pig-contract.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8781/api/health')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Contract fixture did not start')
          PY
          PIG_CONTRACT_SERVER=http://127.0.0.1:8781 swift test --package-path swift/PigKit
      # The PigMusic app build below compiles PigKit's generated client for the
      # simulator, so the separate PigAPI scheme build was dropped (5 min).
      - name: Unsigned production iPhone and iPad build
        run: |
          xcodebuild -quiet -project swift/PigMusic.xcodeproj -scheme PigMusic \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath swift/build/PigMusic \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned production Watch build
        run: |
          xcodebuild -quiet -project swift/PigMusic.xcodeproj -scheme PigMusicWatch \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath swift/build/PigMusic \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      # The tap-through job below runs them; this catches a compile error
      # sooner, so a renamed screen breaks the push within this job.
      - name: Simulator UI test bundles compile
        run: |
          python3 scripts/generate_ui_test_project.py --check
          xcodebuild -quiet -project swift/PigMusicUITests/PigMusicUITests.xcodeproj \
            -scheme PigMusicUITests -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath swift/build/PigMusicUITests CODE_SIGNING_ALLOWED=NO build-for-testing
          xcodebuild -quiet -project swift/PigMusicUITests/PigMusicUITests.xcodeproj \
            -scheme PigMusicWatchUITests -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath swift/build/PigMusicUITests CODE_SIGNING_ALLOWED=NO build-for-testing

  # The simulator tap-through tests (docs/TESTING.md), on a fresh iPhone and
  # Watch pair on the runner's newest runtimes, against the disposable HTTPS
  # test server the script starts. Each class's log (with any failing screen's
  # accessibility tree) and the server log are uploaded as `tap-through-logs`.
  tap-through:
    needs: native
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - name: Available simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          xcrun simctl list devicetypes | grep -Ei 'iphone|watch' || true
          xcrun simctl list pairs available || true
      - name: Test server packages and FFmpeg
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          command -v ffmpeg || brew install ffmpeg
      - name: Tap-through tests (iPhone and Watch)
        run: python3 scripts/simulator_ui_tests.py --create-pair --retry-launch-timeouts
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: tap-through-logs
          # .localdata is a hidden folder; the logs only (not the test CA key).
          path: .localdata/ui-tests/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
