name: Native client checks

# Runs only when the Swift apps, the API contract, the brand kit or the
# scripts that produce them change. Server-only pushes are covered by
# container.yml, which also checks the OpenAPI contract.
on:
  pull_request:
    paths:
      - 'swift/**'
      - 'api/**'
      - 'docs/pig-family-brand-tokens.json'
      - 'docs/native-brand-assets.json'
      - 'docs/brand-asset-provenance.json'
      - 'scripts/serve_contract_fixture.py'
      - 'scripts/generate_native_project.py'
      - 'scripts/sync_native_brand.py'
      - 'scripts/generate_brand_tokens.py'
      - '.github/workflows/native.yml'
  push:
    branches: [main, 'feature/**', 'codex/**']
    paths:
      - 'swift/**'
      - 'api/**'
      - 'docs/pig-family-brand-tokens.json'
      - 'docs/native-brand-assets.json'
      - 'docs/brand-asset-provenance.json'
      - 'scripts/serve_contract_fixture.py'
      - 'scripts/generate_native_project.py'
      - 'scripts/sync_native_brand.py'
      - 'scripts/generate_brand_tokens.py'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            swift/PigKit/.build
            swift/build/PigMusic/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift/PigKit/Package.swift', 'swift/PigKit/Package.resolved', 'swift/PigMusic.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Verify approved branding assets and roles
        run: |
          python scripts/sync_native_brand.py --check
          python scripts/generate_brand_tokens.py --check
      - name: Generated client against isolated server
        run: |
          python -m pip install -r requirements.lock.txt
          python -m scripts.export_openapi --check
          python -m scripts.serve_contract_fixture > /tmp/pig-contract.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8781/api/health')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Contract fixture did not start')
          PY
          PIG_CONTRACT_SERVER=http://127.0.0.1:8781 swift test --package-path swift/PigKit
      # The PigMusic app build below compiles PigKit's generated client for the
      # simulator, so the separate PigAPI scheme build was dropped (5 min).
      - name: Unsigned production iPhone and iPad build
        run: |
          xcodebuild -quiet -project swift/PigMusic.xcodeproj -scheme PigMusic \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath swift/build/PigMusic \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned production Watch build
        run: |
          xcodebuild -quiet -project swift/PigMusic.xcodeproj -scheme PigMusicWatch \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath swift/build/PigMusic \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
