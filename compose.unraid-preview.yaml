# Direct SMB transfers and publication, with Soulseek embedded in the same container.
# HISTORICAL (Compose is retired on the live host). Household addresses are
# ${PIG_MUSIC_...} placeholders: deploy_unraid.py fills them from
# scripts/household.py (.private/household.env); see .env.example.
services:
  pig-music:
    image: pig-music:cleanup-20261006-v3
    container_name: pig-music-preview
    restart: unless-stopped
    user: "99:100"
    cpus: 2
    mem_limit: 4g
    labels:
      net.unraid.docker.webui: "${PIG_MUSIC_LAN_URL:?Set PIG_MUSIC_LAN_URL}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "${PIG_MUSIC_UNRAID_ADDRESS:?Set PIG_MUSIC_UNRAID_ADDRESS}:8765:8765"
    environment:
      PIG_MUSIC_PUBLIC_ORIGIN: ${PIG_MUSIC_TAILNET_ORIGIN:?Set PIG_MUSIC_TAILNET_ORIGIN}
      PIG_MUSIC_TRUSTED_PROXIES: 127.0.0.1,172.25.0.1
      PIG_MUSIC_DATA: /data
      PIG_MUSIC_DOWNLOAD_ROOT: /library/.pig-music-work
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /mnt/user/appdata/pig-music-preview/data:/data
      - /mnt/remotes/SERVER01_Audio:/library
    networks:
      preview:
        gw_priority: 0
      lan:
        ipv4_address: ${PIG_MUSIC_LAN_ADDRESS:?Set PIG_MUSIC_LAN_ADDRESS}
        gw_priority: -1
networks:
  preview:
    name: pig-music-preview
    external: true
  lan:
    name: br0
    external: true
